name: Update market data

on:
  push:
    branches: [main]
  schedule:
    # GitHub Actions cron is UTC. 00:10 UTC = 08:10 China, 09:10 UTC = 17:10 China.
    - cron: "10 0,9 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: market-pages
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch real market data and rebuild page
        env:
          REPLAY_CI: "1"
          TZ: Asia/Shanghai
        run: python update_market.py

      - name: Prepare Pages artifact
        run: |
          mkdir -p public
          cp index.standalone.html public/index.html

      - name: Keep scheduled workflow active
        run: |
          date -u +"%Y-%m-%dT%H:%M:%SZ" > last_run.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add last_run.txt data.js
          git commit -m "chore: market data and keepalive" || true
          git push || true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
